<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Portofino · pubfb</title>
<link rel="icon" href="img/ico.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#16181b; --paper:#f3f4f4; --accent:#67757d; }
  * { margin:0; box-sizing:border-box; }
  body { font-family:'Inter',-apple-system,sans-serif; background:var(--paper); color:var(--ink); }
  .wrap { max-width:1200px; margin:0 auto; padding:0 24px; }

  header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:22px 0; border-bottom:1px solid rgba(22,24,26,.12); flex-wrap:wrap; }
  .brand { font-weight:700; letter-spacing:.35em; font-size:.9rem; }
  .brand span { font-weight:300; color:var(--accent); }
  .ctl { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .ctl input[type=date], .ctl select, .ctl button {
    font:inherit; font-size:.8rem; padding:8px 12px; border:1px solid rgba(22,24,26,.25);
    background:#fff; color:var(--ink); border-radius:6px; cursor:pointer;
  }
  .ctl button { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .ctl button.ghost { background:transparent; color:var(--ink); border-color:rgba(22,24,26,.25); }

  .kick { color:var(--accent); letter-spacing:.32em; font-size:.7rem; font-weight:500; text-transform:uppercase; }
  h1 { font-size:1.4rem; font-weight:600; margin:6px 0 4px; }
  .sub { color:var(--accent); font-size:.85rem; }
  .intro { padding:26px 0 18px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .ollama { font-size:.72rem; letter-spacing:.06em; padding:6px 12px; border-radius:20px; }
  .ollama.on  { background:#e2efe3; color:#2e6b3e; }
  .ollama.off { background:#f3e4e0; color:#8a4a3a; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px; padding:8px 0 8px; }
  .card { background:#fff; border:1px solid rgba(22,24,26,.1); border-radius:10px; overflow:hidden; }
  .card .ph { aspect-ratio:1/1; width:100%; object-fit:cover; display:block; background:#e6e7e7; }
  .card .bd { padding:12px 14px 14px; }
  .card .nm { font-weight:700; font-size:.82rem; letter-spacing:.04em; }
  .card .rb { color:var(--accent); font-size:.68rem; letter-spacing:.18em; text-transform:uppercase; margin-top:2px; }
  .card .ops { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .card .ops button { font:inherit; font-size:.68rem; letter-spacing:.05em; padding:6px 10px; border-radius:6px; border:1px solid rgba(22,24,26,.2); background:#fff; cursor:pointer; }
  .card .ops button.pri { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .lg { display:flex; gap:6px; margin-top:8px; }
  .lg button { flex:1; font-size:.62rem; padding:5px 4px; border-radius:5px; border:1px solid rgba(22,24,26,.18); background:#fff; cursor:pointer; letter-spacing:.04em; }
  .lg button.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .cap { margin:22px 0 60px; background:#fff; border:1px solid rgba(22,24,26,.1); border-radius:10px; padding:18px 20px; }
  .cap textarea { width:100%; min-height:130px; font:inherit; font-size:.85rem; line-height:1.55; border:1px solid rgba(22,24,26,.15); border-radius:8px; padding:12px; resize:vertical; margin-top:12px; }
  .cap .row { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .cap .row button { font:inherit; font-size:.78rem; padding:9px 16px; border-radius:6px; border:1px solid rgba(22,24,26,.2); background:#fff; cursor:pointer; }
  .cap .row button.pri { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  footer { border-top:1px solid rgba(22,24,26,.12); padding:16px 0; font-size:.7rem; color:var(--accent); letter-spacing:.08em; }
</style>
</head>
<body>
<header class="wrap" style="padding-left:0;padding-right:0;max-width:none;border-bottom:none;">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;width:100%;flex-wrap:wrap;gap:12px;border-bottom:1px solid rgba(22,24,26,.12);padding-bottom:18px;">
    <div class="brand">PORTOFINO <span>· pubfb</span></div>
    <div class="ctl">
      <input type="date" id="dia">
      <button class="ghost" id="otra">↺ Otra selección</button>
      <label style="font-size:.75rem;color:var(--accent);">Logo
        <select id="logoSel"><option value="auto">auto</option><option value="w"></option>blanco</option><option value="ink">tinta</option></select>
      </label>
      <label style="font-size:.75rem;color:var(--accent);">
        <input type="checkbox" id="ovl"> overlay nombre
      </label>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="intro">
    <div>
      <div class="kick">Contenido · 2 publicaciones / semana</div>
      <h1 id="tit">Selección del día</h1>
      <div class="sub" id="selInfo"></div>
    </div>
    <div class="ollama off" id="ollamaTag">Ollama: …</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="cap" style="margin:8px 0 0">
    <div class="kick">Modo promoción — estilo del slider del sitio</div>
    <div class="row" style="align-items:center">
      <select id="promoSel" style="font:inherit;font-size:.82rem;padding:9px 12px;border:1px solid rgba(22,24,26,.2);border-radius:6px;background:#fff;min-width:280px"></select>
      <button class="pri" id="dlPromo">Descargar post 1080</button>
      <button id="viewPromo">Vista previa grande</button>
      <button id="capPromo">Usar caption de promo</button>
    </div>
    <div class="row" style="margin-top:12px">
      <input id="prTit" type="text" placeholder="Oferta — ej. precio especial en losa completa" style="flex:2;min-width:220px;font:inherit;font-size:.8rem;padding:9px 12px;border:1px solid rgba(22,24,26,.2);border-radius:6px">
      <input id="prDet" type="text" placeholder="Detalle — ej. en cubiertas: medición, corte e instalación incluidas" style="flex:2;min-width:220px;font:inherit;font-size:.8rem;padding:9px 12px;border:1px solid rgba(22,24,26,.2);border-radius:6px">
      <input id="prVig" type="text" placeholder="Vigencia — ej. hasta agotar existencias" style="flex:1;min-width:180px;font:inherit;font-size:.8rem;padding:9px 12px;border:1px solid rgba(22,24,26,.2);border-radius:6px">
    </div>
    <img id="promoPrev" alt="" style="display:none;width:300px;margin-top:16px;border:1px solid rgba(22,24,26,.12);border-radius:8px">
  </div>

  <div class="cap" style="margin:8px 0 0">
    <div class="kick">Modo producto — 1 publicación: foto principal + variantes</div>
    <div class="row" style="align-items:center">
      <select id="prodSel" style="font:inherit;font-size:.82rem;padding:9px 12px;border:1px solid rgba(22,24,26,.2);border-radius:6px;background:#fff;min-width:280px"></select>
      <button class="pri" id="dlCard">Descargar post 1080</button>
      <button id="viewCard">Vista previa grande</button>
      <label style="font-size:.75rem;color:var(--accent)"><input type="checkbox" id="capSingle"> caption solo de este producto</label>
    </div>
    <img id="cardPrev" alt="" style="display:none;width:300px;margin-top:16px;border:1px solid rgba(22,24,26,.12);border-radius:8px">
  </div>

  <div class="cap">
    <div class="kick">Caption de la publicación</div>
    <textarea id="cap"></textarea>
    <div class="row">
      <button class="pri" id="genOllama">✦ Generar con IA</button>
      <button id="genTpl">Plantilla</button>
      <button id="copyCap">Copiar caption</button>
      <button id="dlAll">Descargar las 4 fotos</button>
    </div>
  </div>
</main>

<footer class="wrap" style="max-width:none;">
  <div class="wrap">pubfb — herramienta interna · no indexada · usa PORTOFINO_DATA + muestras/reales</div>
</footer>

<script src="imagenes.js"></script>
<script src="fb.js"></script>
<script>
const OLLAMA = 'http://localhost:11434';
let picks = [], salt = 0, model = null;

// ── rng determinista por fecha ──
function hash(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const pool = PORTOFINO_DATA.flatMap(r =>
  r.proyectos.flatMap(p => p.fotos.map(f => ({ nombre:p.nombre, rubro:r.rubro, slug:r.slug, foto:f }))));

function pick(dstr){
  const r = rng(hash(dstr+'|'+salt));
  const usados = new Set(), sel = [];
  const arr = [...pool].sort(()=>r()-.5);
  for (const e of arr){ if(!usados.has(e.nombre)){ usados.add(e.nombre); sel.push(e); } if(sel.length===4) break; }
  return sel;
}

// ── canvas 1080 con logo + overlay ──
const logoImg = { w:new Image(), ink:new Image() };
logoImg.w.src='img/logo-w.png'; logoImg.ink.src='img/logo-ink.png';

function loadImg(src){ return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;}); }

function lum(img, sx, sy, sw, sh){
  const c=document.createElement('canvas');c.width=c.height=16;
  const x=c.getContext('2d');x.drawImage(img,sx,sy,sw,sh,0,0,16,16);
  const d=x.getImageData(0,0,16,16).data;let s=0;
  for(let i=0;i<d.length;i+=4)s+=d[i]*.299+d[i+1]*.587+d[i+2]*.114;
  return s/(d.length/4);
}

async function renderPost(e){
  const img = await loadImg(e.foto);
  const c = document.createElement('canvas'); c.width=c.height=1080;
  const x = c.getContext('2d');
  const s = Math.max(1080/img.width, 1080/img.height);
  const w=img.width*s, h=img.height*s;
  x.drawImage(img,(1080-w)/2,(1080-h)/2,w,h);

  // logo completo (placa + PORTOFINO) abajo y centrado, como en la marca; blanco por defecto
  const mode = document.getElementById('logoSel').value;
  const lg = mode==='ink' ? logoImg.ink
    : mode==='w' ? logoImg.w
    : (lum(img, Math.floor(img.width*.32), Math.floor(img.height*.72), Math.floor(img.width*.36), Math.floor(img.height*.26)) < 128 ? logoImg.w : logoImg.ink);
  if (lg.complete && lg.naturalWidth){
    const lw=380, lh=lw*lg.naturalHeight/lg.naturalWidth;
    x.globalAlpha = .55; // marca de agua tenue: la piedra manda, el logo acompaña
    x.drawImage(lg, (1080-lw)/2, 1080-56-lh, lw, lh);
    x.globalAlpha = 1;
  }

  // texto mínimo: producto / rubro arriba a la izquierda
  if (document.getElementById('ovl').checked){
    const gt=x.createLinearGradient(0,0,0,170);
    gt.addColorStop(0,'rgba(0,0,0,.28)');gt.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=gt;x.fillRect(0,0,1080,170);
    x.fillStyle='#fff';x.textBaseline='top';
    x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=8;
    x.letterSpacing='3px';
    x.font='600 20px Inter, sans-serif';
    x.fillText(e.nombre.toUpperCase(),44,44,700);
    x.font='500 13px Inter, sans-serif';x.fillStyle='rgba(255,255,255,.85)';
    x.fillText(e.rubro.toUpperCase(),44,74,700);
    x.letterSpacing='0px';x.shadowBlur=0;x.shadowColor='transparent';
  }
  return c;
}

async function descargar(e, i, dia){
  const c = await renderPost(e);
  const a = document.createElement('a');
  a.download = `portofino-${dia.replaceAll('-','')}-${String(i+1).padStart(2,'0')}.png`;
  a.href = c.toDataURL('image/png'); a.click();
}

// ── modo producto: 1 post = 1 producto con tira de variantes ──
const PRODS = PORTOFINO_DATA.flatMap(r =>
  r.proyectos.map(p => ({ nombre:p.nombre, rubro:r.rubro, slug:r.slug, fotos:p.fotos })));
const slugTxt = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

function cover(x, img, dx, dy, dw, dh, rad){
  const s = Math.max(dw/img.width, dh/img.height);
  const w = img.width*s, h = img.height*s;
  x.save();
  x.beginPath();
  if (rad) x.roundRect(dx, dy, dw, dh, rad); else x.rect(dx, dy, dw, dh);
  x.clip();
  x.drawImage(img, dx+(dw-w)/2, dy+(dh-h)/2, w, h);
  x.restore();
}

async function renderCard(p){
  const c = document.createElement('canvas'); c.width = c.height = 1080;
  const x = c.getContext('2d');
  x.fillStyle = '#f3f4f4'; x.fillRect(0,0,1080,1080);

  // encabezado mínimo: nombre + rubro
  x.fillStyle = '#16181b'; x.textBaseline = 'alphabetic'; x.letterSpacing = '3px';
  x.font = '600 22px Inter, sans-serif';
  x.fillText(p.nombre.toUpperCase(), 48, 74, 984);
  x.font = '500 14px Inter, sans-serif'; x.fillStyle = '#67757d';
  x.fillText(p.rubro.toUpperCase(), 48, 100, 984);
  x.letterSpacing = '0px';

  // foto principal (más alta si no hay variantes)
  const vars = p.fotos.slice(1, 5);
  const main = await loadImg(p.fotos[0]);
  cover(x, main, 48, 128, 984, vars.length ? 610 : 780, 18);

  // tira de variantes (hasta 4; si hay menos, reparte el ancho)
  if (vars.length){
    const n = vars.length, gap = 20, tw = (984-(n-1)*gap)/n, th = 150, ty = 758;
    for (let i=0;i<n;i++){
      const im = await loadImg(vars[i]);
      cover(x, im, 48+i*(tw+gap), ty, tw, th, 14);
    }
  }

  // logo completo abajo y centrado
  const lg = logoImg.ink;
  if (lg.complete && lg.naturalWidth){
    const lw = 220, lh = lw*lg.naturalHeight/lg.naturalWidth;
    x.drawImage(lg, (1080-lw)/2, 1080-44-lh, lw, lh);
  }
  return c;
}

// ── modo promoción: layout del slider del sitio ──
function wrapTxt(x, txt, maxW){
  const out=[]; let cur='';
  for (const w of txt.split(' ')){
    const t = cur ? cur+' '+w : w;
    if (x.measureText(t).width > maxW && cur){ out.push(cur); cur=w; } else cur=t;
  }
  if (cur) out.push(cur);
  return out;
}

async function renderPromo(p, titular, detalle, vigencia){
  const c = document.createElement('canvas'); c.width = c.height = 1080;
  const x = c.getContext('2d');
  x.fillStyle = '#f3f4f4'; x.fillRect(0,0,1080,1080);

  // foto a la derecha, como el slider
  const img = await loadImg(p.fotos[0]);
  cover(x, img, 588, 160, 444, 760, 18);

  // kicker
  x.fillStyle = '#67757d'; x.font = '500 24px Inter, sans-serif'; x.textBaseline = 'alphabetic';
  x.fillText('P R O M O C I Ó N   ·   P O R T O F I N O', 64, 120);

  // titular: nombre — oferta
  x.fillStyle = '#16181b'; x.font = '700 58px Inter, sans-serif';
  let y = 220;
  for (const ln of wrapTxt(x, `${p.nombre} — ${titular}`, 480)){ x.fillText(ln, 64, y); y += 66; }

  // detalle + vigencia
  y += 26;
  x.fillStyle = '#67757d'; x.font = '400 28px Inter, sans-serif';
  for (const ln of wrapTxt(x, detalle, 480)){ x.fillText(ln, 64, y); y += 40; }
  x.font = 'italic 400 26px Inter, sans-serif';
  for (const ln of wrapTxt(x, vigencia, 480)){ x.fillText(ln, 64, y); y += 38; }

  // CTA
  x.fillStyle = '#16181b'; x.font = '600 28px Inter, sans-serif';
  x.fillText('C O T I Z A   P O R   W H A T S A P P  →', 64, 986);

  return c;
}

// ── caption ──
const WA = 'https://wa.me/529933023903';
const CAT = 'https://portofino.com.mx/catalogo.html';
const tit = s => s.toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (m, a, c) => a + c.toUpperCase())
  .replace(/ (De|Del|La|Las|Los|Y|Di|E) /g, w => w.toLowerCase());
const RUBRO_1 = { CUARCITAS:'Cuarcita', CUARZOS:'Cuarzo', GRANITOS:'Granito', MARMOLES:'Mármol', SINTERIZADOS:'Sinterizado', TRAVERTINO:'Travertino', DEKTON:'Dekton', ECLOS:'Éclos', TARJAS:'Tarja', SELLADORES:'Sellador' };
const rubro1 = r => RUBRO_1[r] || tit(r);
const CIERRE = `Envíos a todo México.
🧾 Cotiza en 2 minutos: ${CAT}
💬 WhatsApp: ${WA}`;

const tpl = p =>
`La historia se escribe en piedra.

Hay vetas que tardan milenios en formarse — y un solo instante en encontrar su lugar: tu cocina, tu muro, tu espacio.

Hoy: ${p.map(e=>tit(e.nombre)).join(' · ')}

${CIERRE}

#Portofino #Marmol #Granito #LaHistoriaSeEscribeEnPiedra #Interiorismo #EnviosATodoMexico`;

const tplSingle = p =>
`${tit(p.nombre)} — ${rubro1(p.rubro)}.

Hay materiales que no se compran: se eligen. Pieza a pieza, veta a veta — este es de los que definen un espacio por generaciones.

${CIERRE}

#Portofino #${rubro1(p.rubro).normalize('NFD').replace(/[\u0300-\u036f]/g,'')} #LaHistoriaSeEscribeEnPiedra #Interiorismo #EnviosATodoMexico`;

function setCap(txt){ document.getElementById('cap').value = txt; }

// Gemini primero (fb.js); Ollama local solo como respaldo si está corriendo
async function genOllama(){
  const tag = document.getElementById('ollamaTag');
  const single = document.getElementById('capSingle').checked ? PRODS[+prodSel.value] : null;
  const nombres = single ? `${tit(single.nombre)} (${rubro1(single.rubro)})` : picks.map(e=>`${tit(e.nombre)} (${rubro1(e.rubro)})`).join(', ');
  const prompt =
`Escribe el caption de UNA publicación de Facebook para Portofino, empresa que vende mármol, granito y superficies de alta gama al menudeo, con envíos a todo México.
La publicación muestra: ${nombres}.
Tono: humano y evocativo — habla de permanencia, legado, el hogar donde la piedra vivirá generaciones. Referencia del estilo: "la historia se escribe en piedra". Cero ficha técnica, cero lenguaje de oferta, nada de "precio/descuento". Los nombres de los materiales se mencionan con naturalidad, como parte de la historia — no como lista.
Estructura: 1-2 líneas evocativas de apertura → mención natural de los materiales → este cierre EXACTO, sin cambiarlo:
${CIERRE}
→ 5-7 hashtags. Máximo 80 palabras antes del cierre. Español de México con acentos correctos. Solo el caption, sin comillas, sin markdown ni explicaciones.`;
  tag.textContent = 'IA: generando…';
  let txt = await gemini(prompt), via = 'Gemini';
  if (!txt && model){
    try{
      const r = await fetch(OLLAMA+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model, prompt, stream:false})});
      txt = (await r.json()).response?.trim(); via = 'Ollama '+model;
    }catch(e){}
  }
  if (txt){ setCap(txt.replace(/\*\*/g,'')); tag.className='ollama on'; tag.textContent='IA: '+via; }
  else { tag.className='ollama off'; tag.textContent='IA: sin respuesta — usa Plantilla'; }
}

async function detectOllama(){
  const tag = document.getElementById('ollamaTag');
  tag.className = GEMINI_ON ? 'ollama on' : 'ollama off';
  tag.textContent = GEMINI_ON ? 'IA: Gemini' : 'IA: sin Gemini';
  try{
    const j = await (await fetch(OLLAMA+'/api/tags')).json();
    const names = j.models.map(m=>m.name);
    model = names.find(n=>/llama3|mistral|gemma|qwen/i.test(n)) || names[0];
    if (model) tag.textContent += ' · respaldo Ollama';
  }catch(e){}
}

// ── render ──
function render(){
  const dia = document.getElementById('dia').value;
  picks = pick(dia);
  document.getElementById('tit').textContent = 'Selección del '+new Date(dia+'T12:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('selInfo').textContent = picks.map(e=>e.nombre).join(' · ');
  const g = document.getElementById('grid'); g.innerHTML='';
  picks.forEach((e,i)=>{
    const card = document.createElement('div'); card.className='card';
    card.innerHTML = `<img class="ph" src="${e.foto}" alt="${e.nombre}">
      <div class="bd">
        <div class="nm">${e.nombre}</div><div class="rb">${e.rubro}</div>
        <div class="ops">
          <button class="pri" data-dl="${i}">Descargar PNG 1080</button>
          <button data-view="${i}">Vista previa</button>
        </div>
      </div>`;
    g.appendChild(card);
  });
  g.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>descargar(picks[b.dataset.dl],+b.dataset.dl,dia));
  g.querySelectorAll('[data-view]').forEach(b=>b.onclick=async()=>{
    const w = window.open('','_blank');
    const c = await renderPost(picks[b.dataset.view]);
    w.document.write(`<img src="${c.toDataURL('image/png')}" style="width:100%">`);
  });
  setCap(tpl(picks));
}

document.getElementById('dia').value = new Date().toISOString().slice(0,10);
document.getElementById('dia').onchange = ()=>{salt=0;render()};
document.getElementById('otra').onclick = ()=>{salt++;render()};
document.getElementById('genTpl').onclick = ()=>setCap(tpl(picks));
document.getElementById('genOllama').onclick = genOllama;
document.getElementById('copyCap').onclick = ()=>{
  navigator.clipboard.writeText(document.getElementById('cap').value);
  const b=document.getElementById('copyCap');b.textContent='✓ Copiado';setTimeout(()=>b.textContent='Copiar caption',1500);
};
document.getElementById('dlAll').onclick = async()=>{
  const dia=document.getElementById('dia').value;
  for(let i=0;i<picks.length;i++){ await descargar(picks[i],i,dia); await new Promise(r=>setTimeout(r,350)); }
};

// ── modo producto: select + preview + descarga + caption individual ──
const prodSel = document.getElementById('prodSel');
const cardPrev = document.getElementById('cardPrev');
PRODS.forEach((p,i)=>{
  const o = document.createElement('option');
  o.value = i; o.textContent = `${p.nombre} — ${p.rubro}`;
  prodSel.appendChild(o);
});

let prodCanvas = null;
async function previewCard(){
  const p = PRODS[+prodSel.value];
  if (!p) return;
  prodCanvas = await renderCard(p);
  cardPrev.src = prodCanvas.toDataURL('image/png');
  cardPrev.style.display = 'block';
  if (document.getElementById('capSingle').checked) setCap(tplSingle(p));
}
prodSel.onchange = previewCard;
document.getElementById('capSingle').onchange = () => {
  const p = PRODS[+prodSel.value];
  if (document.getElementById('capSingle').checked && p) setCap(tplSingle(p));
  else setCap(tpl(picks));
};
document.getElementById('dlCard').onclick = async()=>{
  const p = PRODS[+prodSel.value]; if (!p) return;
  const c = prodCanvas || await renderCard(p);
  const a = document.createElement('a');
  a.download = `portofino-post-${slugTxt(p.nombre)}.png`;
  a.href = c.toDataURL('image/png'); a.click();
};
document.getElementById('viewCard').onclick = async()=>{
  const p = PRODS[+prodSel.value]; if (!p) return;
  const c = prodCanvas || await renderCard(p);
  const w = window.open('','_blank');
  w.document.write(`<img src="${c.toDataURL('image/png')}" style="width:100%">`);
};
previewCard();

// ── modo promoción ──
const promoSel = document.getElementById('promoSel');
const promoPrev = document.getElementById('promoPrev');
PRODS.forEach((p,i)=>{
  const o = document.createElement('option');
  o.value = i; o.textContent = `${p.nombre} — ${p.rubro}`;
  promoSel.appendChild(o);
});
document.getElementById('prTit').value = 'precio especial en losa completa';
document.getElementById('prDet').value = 'En cubiertas de cocina: medición, corte e instalación incluidas.';
document.getElementById('prVig').value = 'Vigencia al 30 de noviembre o hasta agotar existencias.';

const promoVals = () => ({
  p: PRODS[+promoSel.value],
  tit: document.getElementById('prTit').value.trim() || 'precio especial',
  det: document.getElementById('prDet').value.trim(),
  vig: document.getElementById('prVig').value.trim(),
});

let promoCanvas = null;
async function previewPromo(){
  const v = promoVals();
  promoCanvas = await renderPromo(v.p, v.tit, v.det, v.vig);
  promoPrev.src = promoCanvas.toDataURL('image/png');
  promoPrev.style.display = 'block';
}
promoSel.onchange = previewPromo;
['prTit','prDet','prVig'].forEach(id => document.getElementById(id).oninput = previewPromo);
document.getElementById('dlPromo').onclick = async()=>{
  const v = promoVals();
  const c = promoCanvas || await renderPromo(v.p, v.tit, v.det, v.vig);
  const a = document.createElement('a');
  a.download = `portofino-promo-${slugTxt(v.p.nombre)}.png`;
  a.href = c.toDataURL('image/png'); a.click();
};
document.getElementById('viewPromo').onclick = async()=>{
  const w = window.open('','_blank');
  const c = promoCanvas || await renderPromo(promoVals().p, promoVals().tit, promoVals().det, promoVals().vig);
  w.document.write(`<img src="${c.toDataURL('image/png')}" style="width:100%">`);
};
const tplPromo = (p,oferta) =>
`PROMOCIÓN — ${tit(p.nombre)}

${oferta.charAt(0).toUpperCase()+oferta.slice(1)}. ${document.getElementById('prDet').value.trim()}

${document.getElementById('prVig').value.trim()}

${CIERRE}

#Portofino #Promocion #${rubro1(p.rubro).normalize('NFD').replace(/[\u0300-\u036f]/g,'')} #EnviosATodoMexico`;
document.getElementById('capPromo').onclick = ()=>setCap(tplPromo(PRODS[+promoSel.value], promoVals().tit));
previewPromo();

detectOllama();
render();
</script>
</body>
</html>
