<!DOCTYPE html>
<!--
  PLANTILLA DE POST — PORTOFINO 1080×1080 (estilo overlay DM Stones)
  Uso:
    plantilla-post.html?foto=../img/thumbs/muestra-marmoles-0.webp&nombre=CARRARA BLANCO&rubro=MÁRMOL&acabado=PULIDO BRILLADO
  Render (Chrome headless):
    chrome --headless --screenshot=post.png --window-size=1080,1080 \
      --virtual-time-budget=3000 "file://$PWD/plantilla-post.html?foto=...&nombre=..."
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; }
  .post { position: relative; width: 1080px; height: 1080px; }
  .post > img.foto {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(10,12,14,.68), rgba(10,12,14,.12) 38%, transparent 55%);
  }
  .overlay {
    position: absolute; left: 56px; bottom: 60px;
    color: #f2f3f4;
    text-shadow: 0 2px 14px rgba(0,0,0,.45);
  }
  .overlay h1 {
    font-family: 'Inter', -apple-system, sans-serif;
    font-weight: 800; font-size: 54px; letter-spacing: .01em;
    line-height: 1.02; text-transform: uppercase;
  }
  .overlay .spec {
    margin-top: 10px;
    font-family: 'Inter', -apple-system, sans-serif;
    font-weight: 500; font-size: 21px;
    letter-spacing: .3em; text-transform: uppercase;
    opacity: .92;
  }
  .logo {
    position: absolute; right: 56px; bottom: 66px;
    height: 34px; opacity: .95;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,.5));
  }
</style>
</head>
<body>
<div class="post">
  <img class="foto" id="foto" src="" alt="">
  <div class="scrim"></div>
  <div class="overlay">
    <h1 id="nombre"></h1>
    <div class="spec" id="spec"></div>
  </div>
  <img class="logo" src="../img/logo-w.png" alt="PORTOFINO">
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('foto').src = q.get('foto') || '../img/thumbs/muestra-marmoles-0.webp';
  document.getElementById('nombre').textContent = q.get('nombre') || 'CARRARA BLANCO';
  const rubro = q.get('rubro') || 'MÁRMOL';
  const acabado = q.get('acabado');
  document.getElementById('spec').textContent = acabado ? `${rubro} | ${acabado}` : rubro;
</script>
</body>
</html>
