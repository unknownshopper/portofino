<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Portofino · admin</title>
<link rel="icon" href="img/ico.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#16181b; --paper:#f3f4f4; --accent:#67757d; }
  * { margin:0; box-sizing:border-box; }
  body { font-family:'Inter',-apple-system,sans-serif; background:var(--paper); color:var(--ink); }
  .wrap { max-width:1000px; margin:0 auto; padding:0 24px; }
  header { border-bottom:1px solid rgba(22,24,26,.12); }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:22px 0; flex-wrap:wrap; }
  .brand { font-weight:700; letter-spacing:.35em; font-size:.9rem; }
  .brand span { font-weight:300; color:var(--accent); }
  .kick { color:var(--accent); letter-spacing:.32em; font-size:.7rem; font-weight:500; text-transform:uppercase; }

  .login { max-width:380px; margin:80px auto; background:#fff; border:1px solid rgba(22,24,26,.1); border-radius:12px; padding:32px 28px; }
  .login h1 { font-size:1.1rem; font-weight:600; margin:6px 0 18px; }
  .login input { width:100%; font:inherit; font-size:.85rem; padding:11px 12px; border:1px solid rgba(22,24,26,.2); border-radius:8px; margin-bottom:10px; }
  button { font:inherit; cursor:pointer; }
  .pri { width:100%; background:var(--ink); color:var(--paper); border:1px solid var(--ink); border-radius:8px; padding:11px; font-size:.85rem; }
  .err { color:#8a4a3a; font-size:.78rem; margin-top:10px; min-height:1em; }

  .q { border:1px solid rgba(22,24,26,.12); border-radius:10px; background:#fff; padding:16px 18px; margin-bottom:14px; }
  .q .top { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline; }
  .q .who { font-weight:700; font-size:.95rem; }
  .q .fecha { color:var(--accent); font-size:.72rem; letter-spacing:.06em; }
  .q .meta { color:var(--accent); font-size:.8rem; margin:4px 0 10px; }
  .q .meta a { color:var(--ink); }
  .q ul { list-style:none; margin:8px 0; }
  .q li { font-size:.84rem; padding:3px 0; border-bottom:1px dashed rgba(22,24,26,.08); }
  .q li b { font-weight:600; }
  .q .msg { font-size:.8rem; color:#444; font-style:italic; margin-top:8px; }
  .q .ops { display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  .q select, .q button { font:inherit; font-size:.74rem; padding:6px 10px; border-radius:6px; border:1px solid rgba(22,24,26,.2); background:#fff; }
  .tag { font-size:.62rem; letter-spacing:.14em; padding:3px 9px; border-radius:20px; text-transform:uppercase; font-weight:600; }
  .tag.pendiente { background:#f6e8d7; color:#8a5a1e; }
  .tag.en-proceso { background:#e0e9f0; color:#2e5b7a; }
  .tag.cerrada { background:#e2efe3; color:#2e6b3e; }
  .canal { font-size:.62rem; color:var(--accent); letter-spacing:.1em; }
  .vacio { text-align:center; color:var(--accent); padding:60px 0; font-size:.9rem; }
  .filtros { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .filtros button { font-size:.72rem; letter-spacing:.08em; padding:7px 14px; border-radius:20px; border:1px solid rgba(22,24,26,.2); background:#fff; }
  .filtros button.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .q .del { color:#8a4a3a; border-color:rgba(138,74,58,.35); margin-left:auto; }
  .tools { display:flex; gap:8px; }
  .tools button { font-size:.74rem; padding:7px 12px; border-radius:6px; border:1px solid rgba(22,24,26,.2); background:#fff; }
  .count { color:var(--accent); font-size:.8rem; }
  .tbl { width:100%; border-collapse:collapse; margin:8px 0 4px; }
  .tbl th { font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600; text-align:left; padding:4px 8px 6px 0; border-bottom:1px solid rgba(22,24,26,.12); }
  .tbl td { font-size:.84rem; padding:7px 8px 7px 0; border-bottom:1px dashed rgba(22,24,26,.08); vertical-align:middle; }
  .tbl th.num, .tbl td.num { text-align:right; }
  .tbl .precio, .ex-row input { width:92px; font:inherit; font-size:.78rem; padding:4px 8px; border:1px solid rgba(22,24,26,.2); border-radius:6px; text-align:right; }
  .tbl .lt { font-weight:600; font-size:.8rem; white-space:nowrap; }
  .ex-row { display:flex; gap:10px; align-items:center; justify-content:flex-end; margin-top:10px; font-size:.76rem; color:var(--accent); flex-wrap:wrap; }
  .ex-row input { width:88px; }
  .q .total { text-align:right; font-weight:700; font-size:.95rem; margin-top:10px; }
  .q .total .gt { color:var(--accent); }
  main { padding:24px 0 60px; }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand">PORTOFINO <span>· cotizaciones</span></div>
    <div class="tools" id="tools" style="display:none">
      <span class="count" id="count"></span>
      <button id="salir">Salir</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="login" id="login">
    <div class="kick">Acceso</div>
    <h1>Panel de cotizaciones</h1>
    <input id="mail" type="email" placeholder="Correo" autocomplete="username">
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="pri" id="entrar">Entrar</button>
    <div class="err" id="err"></div>
  </div>
  <div class="filtros" id="filtros" style="display:none">
    <button data-f="todas" class="on">Todas</button>
    <button data-f="pendiente">Pendientes</button>
    <button data-f="en-proceso">En proceso</button>
    <button data-f="cerrada">Cerradas</button>
  </div>
  <div id="lista" style="display:none"></div>
</main>

<script src="fb.js"></script>
<script src="precios.js"></script>
<script>
const ESTADOS = ['pendiente','en-proceso','cerrada'];
let fb = null;

// distancia aprox en km desde Villahermosa (matriz) — tabla estática, sin APIs
const DIST = {
  'villahermosa':0,'tabasco':15,'coatzacoalcos':170,'minatitlan':180,'comalcalco':60,
  'veracruz':390,'xalapa':400,'jalapa':400,'boca del rio':395,'cordoba':330,
  'tuxtla':250,'tuxtla gutierrez':250,'san cristobal':260,'chiapas':260,'tapachula':380,
  'campeche':400,'cd del carmen':220,'ciudad del carmen':220,'merida':550,'yucatan':560,
  'cancun':800,'playa del carmen':740,'chetumal':460,'quintana roo':700,
  'oaxaca':550,'puebla':700,'cdmx':780,'ciudad de mexico':780,'mexico':780,'toluca':750,
  'queretaro':950,'leon':1100,'guanajuato':1100,'aguascalientes':1200,
  'guadalajara':1150,'jalisco':1150,'monterrey':1200,'nuevo leon':1200,
  'saltillo':1180,'tampico':650,'hermosillo':2300,'tijuana':3200,'chihuahua':1900,
};
function distancia(ciudad){
  if (!ciudad) return '';
  const c = ciudad.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  for (const k in DIST) if (c.includes(k)) return `≈${DIST[k]} km de Villahermosa`;
  return '';
}

function fmt(ts){
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}

async function cargar(){
  const lista = document.getElementById('lista');
  const snap = await fb.firestore().collection('cotizaciones').orderBy('creado','desc').limit(300).get();
  document.getElementById('count').textContent = snap.size + ' solicitudes';
  lista.innerHTML = '';
  if (snap.empty){ lista.innerHTML = '<div class="vacio">Sin solicitudes todavía.</div>'; return; }
  snap.forEach(doc => {
    const q = doc.data();
    const div = document.createElement('div'); div.className='q';
    div.dataset.estado = q.estado || 'pendiente';
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = n => n.toLocaleString('es-MX',{style:'currency',currency:'MXN'});
    const precios = [...(q.precios||[])];
    const m2De = p => parseFloat(p && p.m2) || 0;
    const baseDe = p => p && PRECIOS_BASE[p.nombre] != null ? PRECIOS_BASE[p.nombre]
                     : p && PRECIOS_BASE['_'+p.rubro] != null ? PRECIOS_BASE['_'+p.rubro] : null;
    const nprod = (q.productos||[]).length;
    const filas = (q.productos||[]).map((p,i) => {
      const m2 = m2De(p);
      const pv = precios[i] == null ? (baseDe(p) ?? '') : precios[i];
      return `<tr>
        <td><b>${esc(p.nombre)}</b> <span style="color:var(--accent);font-size:.72rem">${esc(p.rubro)}</span>${p.medidas?`<div style="font-size:.72rem;color:var(--accent)">${esc(p.medidas)}</div>`:''}</td>
        <td class="num">${m2?esc(p.m2):'—'}</td>
        <td class="num"><input class="precio" data-i="${i}" type="number" min="0" step="any" value="${esc(pv)}" placeholder="${m2?'$/m²':'$'}"></td>
        <td class="num lt">${(pv!=='' && m2)?money(m2*pv):((pv!=='' && !m2)?money(pv):'')}</td>
      </tr>`;
    }).join('');
    const prods = nprod ? `<table class="tbl"><thead><tr><th>Producto</th><th class="num">m²</th><th class="num">$/m²</th><th class="num">Total</th></tr></thead><tbody>${filas}</tbody></table>` : '';
    div.innerHTML = `
      <div class="top">
        <span class="who">${esc(q.nombre)||'—'}</span>
        <span class="tag ${q.estado||'pendiente'}">${(q.estado||'pendiente').replace('-',' ')}</span>
      </div>
      <div class="meta">
        <a href="tel:${esc(q.telefono)}">${esc(q.telefono)||''}</a>${q.correo?' · <a href="mailto:'+esc(q.correo)+'">'+esc(q.correo)+'</a>':''} · ${esc(q.ciudad)||''}${distancia(q.ciudad)?` <b style="color:var(--ink);font-weight:600">${distancia(q.ciudad)}</b>`:''}
        · <span class="fecha">${fmt(q.creado)}</span> · <span class="canal">vía ${esc(q.canal)||'—'}</span>
        ${q.instalacion?' · <b style="color:var(--ink)">🔧 con instalación</b>':''}
      </div>
      ${prods}
      ${nprod?`<div class="ex-row">
        <span>+ Envío $ <input class="flete" type="number" min="0" step="any" value="${esc(q.flete||'')}"></span>
        <span>+ Otros $ <input class="otros" type="number" min="0" step="any" value="${esc(q.otros||'')}"></span>
      </div>
      <div class="total">Total: <span class="gt">—</span></div>`:''}
      ${q.mensaje?`<div class="msg">“${esc(q.mensaje)}”</div>`:''}
      <div class="ops">
        Estado <select>${ESTADOS.map(e=>`<option ${e===(q.estado||'pendiente')?'selected':''}>${e}</option>`).join('')}</select>
        <a href="https://wa.me/52${(q.telefono||'').replace(/\D/g,'').replace(/^52/,'')}" target="_blank" style="font-size:.74rem">Responder por WhatsApp →</a>
        ${(q.productos||[]).length?'<button class="copia">Copiar cotización</button>':''}
        <button class="del">Eliminar</button>
      </div>`;
    const recalc = () => {
      let mat = 0;
      div.querySelectorAll('.precio').forEach(inp => {
        const i = +inp.dataset.i;
        const p = (q.productos||[])[i];
        const m2 = m2De(p);
        const v = parseFloat(inp.value) || 0;
        const td = inp.closest('td').nextElementSibling;
        td.textContent = (v && p) ? money(m2 ? v*m2 : v) : '';
        if (p) mat += m2 ? v*m2 : v;
      });
      const fl = parseFloat(div.querySelector('.flete')?.value) || 0;
      const ot = parseFloat(div.querySelector('.otros')?.value) || 0;
      const gtEl = div.querySelector('.gt');
      if (gtEl) gtEl.textContent = (mat || fl || ot) ? money(mat + fl + ot) : '—';
    };
    const guardar = async campo => {
      try { await fb.firestore().collection('cotizaciones').doc(doc.id).update(campo); }
      catch(e){ alert('No se pudo guardar — revisa tu conexión.'); }
    };
    div.querySelectorAll('.precio').forEach(inp => inp.onchange = async () => {
      precios[+inp.dataset.i] = parseFloat(inp.value) || null;
      await guardar({precios});
      recalc();
    });
    ['.flete','.otros'].forEach(sel => {
      const el = div.querySelector(sel);
      if (el) el.onchange = async () => {
        await guardar({ [sel.slice(1)]: parseFloat(el.value) || null });
        recalc();
      };
      if (el) el.oninput = () => recalc();
    });
    recalc();
    const copiaBtn = div.querySelector('.copia');
    if (copiaBtn) copiaBtn.onclick = async () => {
      let mat = 0;
      const lines = (q.productos||[]).map((p,i) => {
        const m2 = m2De(p);
        const v = parseFloat(precios[i]) || 0;
        const line = m2 ? v*m2 : v;
        mat += line;
        return `• ${p.nombre}${p.rubro?' ('+p.rubro+')':''}${p.medidas?` — ${p.medidas}`:(m2?` — ${p.m2} m²`:'')}${v?` × ${money(v)}${m2?'/m²':''} = ${money(line)}`:' — precio pendiente'}`;
      });
      const fl = parseFloat(div.querySelector('.flete')?.value) || 0;
      const ot = parseFloat(div.querySelector('.otros')?.value) || 0;
      const gt = mat + fl + ot;
      const desglose = [mat && `Materiales: ${money(mat)}`, fl && `Envío: ${money(fl)}`, ot && `Otros: ${money(ot)}`, gt && `TOTAL: ${money(gt)}`].filter(Boolean).join('\n');
      const txt = `Cotización PORTOFINO${q.nombre?' — '+q.nombre:''}\n\n${lines.join('\n')}${gt?'\n\n'+desglose:''}`;
      try {
        await navigator.clipboard.writeText(txt);
        copiaBtn.textContent = '✓ Copiada';
        setTimeout(() => copiaBtn.textContent = 'Copiar cotización', 1600);
      } catch(e){ alert('No se pudo copiar — selecciona el texto manualmente.'); }
    };
    div.querySelector('select').onchange = async e => {
      await fb.firestore().collection('cotizaciones').doc(doc.id).update({estado: e.target.value});
      div.dataset.estado = e.target.value;
      div.querySelector('.tag').className = 'tag '+e.target.value;
      div.querySelector('.tag').textContent = e.target.value.replace('-',' ');
      aplicarFiltro();
    };
    div.querySelector('.del').onclick = async () => {
      if (!confirm(`¿Eliminar la solicitud de "${q.nombre||'—'}"?`)) return;
      await fb.firestore().collection('cotizaciones').doc(doc.id).delete();
      div.remove();
      document.getElementById('count').textContent =
        lista.querySelectorAll('.q').length + ' solicitudes';
    };
    lista.appendChild(div);
  });
  aplicarFiltro();
}

let filtro = 'todas';
function aplicarFiltro(){
  document.querySelectorAll('#lista .q').forEach(el =>
    el.style.display = (filtro==='todas' || el.dataset.estado===filtro) ? '' : 'none');
}
document.querySelectorAll('#filtros button').forEach(b => b.onclick = () => {
  filtro = b.dataset.f;
  document.querySelectorAll('#filtros button').forEach(x => x.classList.toggle('on', x===b));
  aplicarFiltro();
});

async function boot(){
  fb = await __fbLoad();
  if (!fb){
    document.getElementById('err').textContent =
      'Firebase sin configurar — pega la config del proyecto en fb.js (console.firebase.google.com).';
    document.getElementById('entrar').disabled = true;
    return;
  }
  fb.auth().onAuthStateChanged(u => {
    document.getElementById('login').style.display = u ? 'none' : 'block';
    document.getElementById('lista').style.display = u ? 'block' : 'none';
    document.getElementById('filtros').style.display = u ? 'flex' : 'none';
    document.getElementById('tools').style.display = u ? 'flex' : 'none';
    if (u) cargar();
  });
  document.getElementById('entrar').onclick = async () => {
    document.getElementById('err').textContent = '';
    try { await fb.auth().signInWithEmailAndPassword(mail.value.trim(), pass.value); }
    catch(e){ document.getElementById('err').textContent = 'Credenciales incorrectas.'; }
  };
  document.getElementById('pass').onkeydown = e => { if(e.key==='Enter') entrar.click(); };
  document.getElementById('salir').onclick = () => fb.auth().signOut();
}
boot();
</script>
</body>
</html>
