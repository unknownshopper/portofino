<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Catálogo PORTOFINO — mármoles, granitos exóticos, Silestone y Dekton. Superficies para cocinas, baños y revestimientos. Tabasco, Chiapas, Veracruz y Campeche.">
<title>PORTOFINO — Materiales</title>
<link rel="icon" type="image/png" href="img/ico.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16181b;
    --paper: #f3f4f4;
    --accent: #67757d;
    --light: #f2f3f4;
    --hairline: rgba(22,24,26,.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  /* ── nav ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.6rem 2rem;
    z-index: 10;
    font-size: .68rem; letter-spacing: .3em; text-transform: uppercase;
    background: linear-gradient(to bottom, var(--paper) 55%, transparent);
  }
  nav a { color: var(--ink); text-decoration: none; opacity: .8; }
  nav a:hover { opacity: 1; }
  nav .brand img { height: 24px; display: block; }

  /* ── cabecera ── */
  .head {
    padding: 8.5rem 2rem 2.5rem;
    max-width: 1200px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 2rem; flex-wrap: wrap;
  }
  .head .k {
    font-size: .68rem; letter-spacing: .3em; text-transform: uppercase;
    color: var(--accent); display: block; margin-bottom: 1.2rem;
  }
  .head h1 {
    font-family: 'Inter', -apple-system, sans-serif;
    font-weight: 700; font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1;
    letter-spacing: -.025em;
  }
  .head .total {
    font-size: .68rem; letter-spacing: .26em; text-transform: uppercase;
    color: var(--accent); padding-bottom: .4rem;
  }

  /* ── filtros ── */
  .filtros {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    padding: 1.1rem 2rem;
    display: flex; gap: .6rem; flex-wrap: wrap;
  }
  .chip {
    font-family: 'Inter', sans-serif;
    font-size: .64rem; letter-spacing: .24em; text-transform: uppercase;
    padding: .55rem 1.15rem;
    border: 1px solid var(--hairline);
    background: transparent; color: var(--ink);
    cursor: pointer; border-radius: 999px;
    transition: background .25s, color .25s, border-color .25s;
  }
  .chip:hover { border-color: var(--ink); }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* ── grid de proyectos ── */
  .proyectos {
    max-width: 1200px; margin: 0 auto;
    padding: 3rem 2rem 6rem;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }
  @media (max-width: 900px) { .proyectos { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .proyectos { grid-template-columns: 1fr; } }

  .proy {
    position: relative; display: block; overflow: hidden;
    aspect-ratio: 4/5; background: #e7e9e9;
    cursor: pointer; border: none; padding: 0; text-align: left;
  }
  .proy img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform 1.2s cubic-bezier(.2,.6,.2,1);
    background: #e7e9e9;
  }
  .proy:hover img { transform: scale(1.05); }
  .proy figcaption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 1.2rem 1.4rem;
    background: linear-gradient(to top, rgba(14,16,18,.7), transparent);
    color: var(--light);
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
  }
  .proy .nombre {
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 1.05rem; font-weight: 500; line-height: 1.2;
  }
  .proy .meta {
    font-size: .6rem; letter-spacing: .22em; text-transform: uppercase;
    opacity: .8; white-space: nowrap;
  }

  /* ── lightbox ── */
  .lb {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(14,16,18,.94);
    display: none;
    flex-direction: column;
  }
  .lb.open { display: flex; }
  .lb-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.4rem 2rem;
    color: var(--light);
  }
  .lb-titulo {
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 1.2rem; font-weight: 600;
  }
  .lb-titulo .lb-rubro { display: block; font-family: 'Inter', sans-serif; font-size: .62rem; letter-spacing: .28em; text-transform: uppercase; opacity: .6; margin-top: .3rem; }
  .lb-cerrar {
    background: none; border: 1px solid rgba(242,243,244,.4); color: var(--light);
    font-family: 'Inter', sans-serif; font-size: .62rem; letter-spacing: .28em; text-transform: uppercase;
    padding: .7rem 1.3rem; cursor: pointer;
  }
  .lb-cerrar:hover { background: var(--light); color: var(--ink); }
  .lb-main {
    flex: 1; position: relative;
    display: flex; align-items: center; justify-content: center;
    min-height: 0; padding: 0 4.5rem;
  }
  .lb-main img {
    max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
  }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: none; border: 1px solid rgba(242,243,244,.35); color: var(--light);
    width: 3rem; height: 3rem; border-radius: 50%;
    font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .25s, color .25s;
  }
  .lb-nav:hover { background: var(--light); color: var(--ink); }
  .lb-prev { left: 1.2rem; }
  .lb-next { right: 1.2rem; }
  .lb-count {
    text-align: center; color: var(--light);
    font-size: .65rem; letter-spacing: .3em;
    padding: 1.2rem; opacity: .7;
  }
  @media (max-width: 640px) {
    .lb-main { padding: 0 1rem; }
    .lb-nav { width: 2.6rem; height: 2.6rem; }
    .lb-prev { left: .6rem; } .lb-next { right: .6rem; }
  }

  footer {
    padding: 2rem;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    font-size: .65rem; letter-spacing: .18em; text-transform: uppercase;
    opacity: .5;
  }

  /* ── chat ── */
  .chat-fab {
    position: fixed; right: 1.4rem; bottom: 1.4rem; z-index: 60;
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--ink); color: var(--paper);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 14px 34px -10px rgba(22,24,26,.55);
    transition: transform .25s;
  }
  .chat-fab:hover { transform: scale(1.07); }
  .chat-fab svg { width: 24px; height: 24px; }
  .chat-box {
    position: fixed; right: 1.4rem; bottom: 5.6rem; z-index: 60;
    width: min(360px, calc(100vw - 2.8rem));
    height: min(480px, calc(100dvh - 8rem));
    background: var(--paper);
    border: 1px solid rgba(22,24,26,.14);
    border-radius: 18px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 30px 70px -20px rgba(22,24,26,.4);
    opacity: 0; transform: translateY(14px) scale(.97);
    pointer-events: none;
    transition: opacity .3s, transform .3s;
  }
  .chat-box.open { opacity: 1; transform: none; pointer-events: auto; }
  .chat-top {
    display: flex; align-items: center; gap: .7rem;
    padding: .85rem 1rem;
    background: var(--ink); color: var(--paper);
  }
  .chat-top img { width: 26px; height: 26px; border-radius: 50%; }
  .chat-top b { font-size: .8rem; font-weight: 600; letter-spacing: .05em; display: block; }
  .chat-top span {
    font-size: .62rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); display: flex; align-items: center; gap: .35rem;
  }
  .chat-top span::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: #7fb069; display: inline-block;
  }
  .chat-x {
    margin-left: auto; background: none; border: none;
    color: var(--paper); font-size: 1.3rem; cursor: pointer;
    line-height: 1; padding: .2rem .3rem; opacity: .7;
  }
  .chat-x:hover { opacity: 1; }
  .chat-log {
    flex: 1; overflow-y: auto;
    padding: 1rem .9rem;
    display: flex; flex-direction: column; gap: .5rem;
  }
  .msg {
    max-width: 84%; padding: .55rem .8rem;
    border-radius: 14px; font-size: .84rem; line-height: 1.5;
  }
  .msg.bot {
    background: #fff; color: var(--ink);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(22,24,26,.08);
  }
  .msg.me {
    background: var(--ink); color: var(--paper);
    align-self: flex-end; border-bottom-right-radius: 4px;
  }
  .msg.bot a { color: var(--accent); font-weight: 600; }
  .msg .wa-row { display: flex; flex-direction: column; gap: .4rem; margin-top: .5rem; }
  .msg .wa {
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid var(--accent); border-radius: 10px;
    padding: .5rem .75rem; text-decoration: none;
    font-weight: 600;
  }
  .msg .wa:hover { background: var(--accent); color: #fff; }
  .msg.typing { display: flex; gap: 4px; padding: .7rem .9rem; }
  .msg.typing i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); opacity: .4;
    animation: blink 1.2s infinite;
  }
  .msg.typing i:nth-child(2) { animation-delay: .2s; }
  .msg.typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  .chat-chips {
    display: flex; flex-wrap: wrap; gap: .4rem;
    padding: .5rem .9rem;
  }
  .chat-chips button {
    background: none; border: 1px solid var(--accent);
    color: var(--accent); border-radius: 99px;
    font-family: inherit; font-size: .72rem;
    padding: .35rem .75rem; cursor: pointer;
    transition: background .2s, color .2s;
  }
  .chat-chips button:hover { background: var(--accent); color: var(--paper); }
  .chat-form {
    display: flex; gap: .5rem;
    padding: .7rem .9rem .9rem;
    border-top: 1px solid rgba(22,24,26,.1);
  }
  .chat-form input {
    flex: 1; border: 1px solid rgba(22,24,26,.16);
    border-radius: 99px; padding: .55rem .95rem;
    font-family: inherit; font-size: .82rem;
    background: #fff; color: var(--ink); outline: none;
  }
  .chat-form input:focus { border-color: var(--accent); }
  .chat-form button {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--ink); color: var(--paper);
    border: none; cursor: pointer; font-size: 1rem;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<nav>
  <a class="brand" href="index.html" aria-label="PORTOFINO"><img src="img/logo-ink.png" alt="PORTOFINO — Mármol &amp; Granito"></a>
  <div style="display:flex;gap:2rem;align-items:center;">
    <a href="catalogo.html">Catálogo</a>
    <a href="index.html#contacto">Contacto</a>
  </div>
</nav>

<header class="head">
  <div>
    <span class="k">Catálogo</span>
    <h1>Materiales</h1>
  </div>
  <span class="total" id="total"></span>
</header>

<div class="filtros" id="filtros"></div>

<main class="proyectos" id="grid"></main>

<!-- LIGHTBOX -->
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <div class="lb-top">
    <div class="lb-titulo"><span id="lbName"></span><span class="lb-rubro" id="lbRubro"></span></div>
    <button class="lb-cerrar" id="lbCerrar">Cerrar</button>
  </div>
  <div class="lb-main">
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Anterior">←</button>
    <img id="lbImg" alt="">
    <button class="lb-nav lb-next" id="lbNext" aria-label="Siguiente">→</button>
  </div>
  <div class="lb-count" id="lbCount"></div>
</div>

<footer>
  <span>© PORTOFINO</span>
  <a href="aviso.html" style="color:inherit;text-decoration:none;">Aviso de privacidad</a>
  <span>Tabasco · Chiapas · Veracruz · Campeche</span>
</footer>

<!-- CHAT -->
<button class="chat-fab" id="chatFab" aria-label="Abrir asistente">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
</button>
<div class="chat-box" id="chatBox" role="dialog" aria-label="Asistente Portofino">
  <div class="chat-top">
    <img src="img/ico-w.png" alt="">
    <div><b>PORTOFINO Asistente</b><span>en línea</span></div>
    <button class="chat-x" id="chatX" aria-label="Cerrar chat">×</button>
  </div>
  <div class="chat-log" id="chatLog"></div>
  <div class="chat-chips" id="chatChips"></div>
  <form class="chat-form" id="chatForm">
    <input id="chatIn" type="text" placeholder="Escriba su mensaje…" autocomplete="off">
    <button type="submit" aria-label="Enviar">→</button>
  </form>
</div>

<script src="imagenes.js"></script>
<script>
const grid = document.getElementById('grid');
const filtrosEl = document.getElementById('filtros');
const totalEl = document.getElementById('total');

// ── tarjetas: un proyecto = una tarjeta ──
function tarjetas(rubro) {
  const cards = rubro.proyectos.map(p => ({
    titulo: p.nombre,
    fotos: p.fotos,
    rubro: rubro.rubro
  }));
  if (rubro.varios.length) {
    cards.push({ titulo: 'Varios', fotos: rubro.varios, rubro: rubro.rubro });
  }
  return cards;
}

let activo = location.hash.slice(1) || 'todos';

function renderFiltros() {
  const chips = [{ slug: 'todos', rubro: 'Todos' }, ...PORTOFINO_DATA];
  filtrosEl.innerHTML = '';
  chips.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (c.slug === activo ? ' on' : '');
    b.textContent = c.rubro;
    b.onclick = () => { location.hash = c.slug; };
    filtrosEl.appendChild(b);
  });
}

function renderGrid() {
  grid.innerHTML = '';
  let nFotos = 0;
  PORTOFINO_DATA
    .filter(r => activo === 'todos' || r.slug === activo)
    .forEach(r => tarjetas(r).forEach(card => {
      nFotos += card.fotos.length;
      const fig = document.createElement('figure');
      fig.className = 'proy';
      fig.innerHTML =
        `<img src="${card.thumb || card.fotos[0]}" alt="${card.titulo}" loading="lazy">
         <figcaption>
           <span class="nombre">${card.titulo}</span>
           <span class="meta">${card.fotos.length} foto${card.fotos.length === 1 ? '' : 's'}</span>
         </figcaption>`;
      fig.onclick = () => abrirLB(card);
      grid.appendChild(fig);
    }));
  totalEl.textContent = `${nFotos} fotografías`;
}

// ── lightbox ──
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');
const lbName = document.getElementById('lbName');
const lbRubro = document.getElementById('lbRubro');
const lbCount = document.getElementById('lbCount');
let lbFotos = [], lbIdx = 0;

function abrirLB(card) {
  lbFotos = card.fotos; lbIdx = 0;
  lbName.textContent = card.titulo;
  lbRubro.textContent = card.rubro;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  mostrar();
}
function cerrarLB() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
  lbImg.src = '';
}
function mostrar() {
  lbImg.src = lbFotos[lbIdx];
  lbCount.textContent = `${lbIdx + 1} / ${lbFotos.length}`;
  // precargar siguiente
  const pre = new Image();
  pre.src = lbFotos[(lbIdx + 1) % lbFotos.length];
}
function paso(d) {
  lbIdx = (lbIdx + d + lbFotos.length) % lbFotos.length;
  mostrar();
}

document.getElementById('lbCerrar').onclick = cerrarLB;
document.getElementById('lbPrev').onclick = () => paso(-1);
document.getElementById('lbNext').onclick = () => paso(1);
lb.addEventListener('click', e => { if (e.target === lb) cerrarLB(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') cerrarLB();
  if (e.key === 'ArrowLeft') paso(-1);
  if (e.key === 'ArrowRight') paso(1);
});

// ── hash routing ──
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  activo = PORTOFINO_DATA.some(r => r.slug === h) ? h : 'todos';
  renderFiltros(); renderGrid();
});

if (!PORTOFINO_DATA.some(r => r.slug === activo)) activo = 'todos';
renderFiltros();
renderGrid();

// chat asistente — responde por palabras clave
const chatBox = document.getElementById('chatBox');
const chatLog = document.getElementById('chatLog');
const chatChips = document.getElementById('chatChips');
let chatGreeted = false;

const RESPUESTAS = [
  [/hola|buenas|qu[eé] tal/, '¡Hola! Bienvenido a PORTOFINO — mármol, granito y superficies de alta gama. Puedo mostrarle materiales, hablarle de precios o contactarlo con un asesor. ¿Qué busca?', ['Ver materiales','Cotizar','Contactar asesor']],
  [/precio|costo|cu[aá]nto|cotiza|vale|m2|metro/, 'El precio depende del material, la losa y las medidas — se cotiza por m². Mándenos las medidas de su proyecto por WhatsApp y le cotizamos hoy. <span class="wa-row"><a class="wa" href="https://wa.me/529933939163">Cotizar <span>WhatsApp →</span></a></span>', ['Ver materiales','Contactar asesor']],
  [/m[aá]rmol|marmol/, 'Manejamos mármoles nacionales e importados, veta por veta. Vea las losas aquí mismo en la <a href="#marmoles">galería</a>.', ['Cotizar','Contactar asesor']],
  [/granito/, 'Granitos nacionales y exóticos de alta resistencia — ideales para cocina y exterior. Vea opciones en la <a href="#granitos">galería</a>.', ['Cotizar','Contactar asesor']],
  [/silestone|cuarzo/, 'Somos distribuidores oficiales de Silestone®. Vea los colores disponibles en la <a href="#silestone">galería</a>.', ['Cotizar','Contactar asesor']],
  [/dekton|ultracompacto/, 'Somos distribuidores oficiales de Dekton® — superficie ultracompacta para cocinas, fachadas y exterior. Vea la <a href="#dekton">galería</a>.', ['Cotizar','Contactar asesor']],
  [/cocina|cubierta|barra|meseta/, 'Fabricamos cubiertas de cocina en mármol, granito, Silestone y Dekton — corte e instalación incluidos. Vea trabajos en la <a href="#cocinas">galería</a>.', ['Cotizar','Contactar asesor']],
  [/ba[ñn]o|lavabo|revestimiento|muro|fachada/, 'Hacemos baños y revestimientos en piedra natural y ultracompactos. Vea ejemplos en la <a href="#banos">galería</a>.', ['Cotizar','Contactar asesor']],
  [/losa|placa|material|piedra|onix|[oó]nix|travertino/, 'Toda nuestra línea de materiales está aquí mismo — filtre por categoría arriba o toque cualquier tarjeta.', ['Ver materiales','Cotizar']],
  [/instala|colocaci[oó]n|entrega|env[ií]o|flete/, 'El costo de instalación y entrega se cotiza con el proyecto según ciudad y medidas. Escríbanos por WhatsApp. <span class="wa-row"><a class="wa" href="https://wa.me/529933939163">Ventas <span>WhatsApp →</span></a></span>', ['Cotizar']],
  [/tabasco|villahermosa|chiapas|tuxtla|veracruz|campeche|ciudad|ubicaci[oó]n|direcci[oó]n|d[oó]nde|sucursal|showroom|visita|cita|horario|agenda|contacto|asesor|whatsapp|tel[eé]fono|llamada/, 'Atendemos Tabasco, Chiapas, Veracruz y Campeche. Escríbanos y le decimos la sucursal que le queda más cerca. <span class="wa-row"><a class="wa" href="https://wa.me/529933939163">Ventas <span>WhatsApp →</span></a></span>', ['Ver materiales']],
  [/galer[ií]a|foto|cat[aá]logo/, 'Ya está en la galería — filtre por material arriba. Para armar una cotización, vaya al <a href="catalogo.html">catálogo</a>.', ['Cotizar','Contactar asesor']],
  [/gracias|adi[oó]s|perfecto|ok/, 'Con gusto. Cuando quiera cotizar, estamos a un mensaje. ¡Hasta pronto!', []],
];
const CHAT_FALLBACK = 'Para eso le conviene un asesor — le respondemos hoy mismo por WhatsApp: <span class="wa-row"><a class="wa" href="https://wa.me/529933939163">Ventas <span>WhatsApp →</span></a></span>';

function addMsg(html, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  if (who === 'me') d.textContent = html; else d.innerHTML = html;
  chatLog.appendChild(d);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function setChips(list) {
  chatChips.innerHTML = '';
  list.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = c;
    b.onclick = () => sendMsg(c);
    chatChips.appendChild(b);
  });
}

function botSay(text) {
  const t = document.createElement('div');
  t.className = 'msg bot typing';
  t.innerHTML = '<i></i><i></i><i></i>';
  chatLog.appendChild(t);
  chatLog.scrollTop = chatLog.scrollHeight;
  const hit = RESPUESTAS.find(([re]) => re.test(text.toLowerCase()));
  const [ , reply, chips ] = hit || [null, CHAT_FALLBACK, ['Agendar cita']];
  setTimeout(() => { t.remove(); addMsg(reply, 'bot'); setChips(chips); }, 800 + Math.random() * 500);
}

function sendMsg(text) {
  if (!text.trim()) return;
  addMsg(text, 'me');
  document.getElementById('chatIn').value = '';
  setChips([]);
  botSay(text);
}

document.getElementById('chatFab').onclick = () => {
  chatBox.classList.toggle('open');
  if (chatBox.classList.contains('open') && !chatGreeted) {
    chatGreeted = true;
    botSay('hola');
  }
};
document.getElementById('chatX').onclick = () => chatBox.classList.remove('open');
document.getElementById('chatForm').onsubmit = e => {
  e.preventDefault();
  sendMsg(document.getElementById('chatIn').value);
};
</script>
</body>
</html>
